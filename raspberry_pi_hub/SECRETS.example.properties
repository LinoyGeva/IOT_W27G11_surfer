# Blank template. Copy to SECRETS.local.properties (ignored) and fill in.
# Read by settings.gradle.kts and build.gradle.kts. Never store backend admin keys here.

# GitHub account + personal token with read:packages, used to download the
# Maverick SDK from GitHub Packages. Falls back to GITHUB_ACTOR / GITHUB_TOKEN.
github.user=
github.packages_token=

# Path (relative to raspberry_pi_hub/) of the Maverick key file received from
# Everysight, e.g. sdk.key. *.key files are ignored by Git. The build bundles it
# into the APK assets as sdk.key; leave blank to build without it.
maverick.api_key_file=

cloud.device_token=
